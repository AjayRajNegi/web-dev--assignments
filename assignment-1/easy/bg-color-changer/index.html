<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        box-sizing: border-box;
      }
    </style>
    <title>Bg-Color-Changer</title>
  </head>
  <body class="flex items-end">
    <div
      class="colorBar w-fit flex gap-2 shadow-xl border-[1px] border-black/20 rounded-lg px-4 py-2 mx-auto mb-10 bg-white"
    >
      <div
        class="color bg-red-500 text-white px-4 py-1 rounded-md shadow-xl hover:scale-110 transition-all duration-200"
        data-color="red"
      >
        Red
      </div>
      <div
        class="color bg-yellow-500 text-white px-4 py-1 rounded-md hover:scale-110 transition-all duration-200 shadow-xl"
        data-color="yellow"
      >
        Yellow
      </div>
      <div
        class="color bg-black text-white px-4 py-1 rounded-md shadow-xl hover:scale-110 transition-all duration-200"
        data-color="black"
      >
        Black
      </div>
      <div
        class="color bg-purple-500 text-white px-4 py-1 rounded-md hover:scale-110 transition-all duration-200 shadow-xl"
        data-color="purple"
      >
        Purple
      </div>
      <div
        class="color bg-green-500 text-white px-4 py-1 rounded-md hover:scale-110 transition-all duration-200 shadow-xl"
        data-color="green"
      >
        Green
      </div>
      <div
        class="color bg-blue-500 text-white px-4 py-1 rounded-md hover:scale-110 transition-all duration-200 shadow-xl"
        data-color="blue"
      >
        Blue
      </div>
      <div
        class="color bg-white text-black border-[0.5px] border-black/20 hover:scale-110 transition-all duration-200 px-4 py-1 rounded-md shadow-xl"
        data-color="white"
      >
        Default
      </div>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
