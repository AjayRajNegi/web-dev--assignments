<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Pokémon Finder</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap");

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
      }

      .card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      }

      .search-btn {
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        transition: all 0.3s ease;
      }

      .search-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(245, 87, 108, 0.4);
      }

      .search-btn:active {
        transform: translateY(0);
      }

      input:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.3);
      }

      .pokemon-name {
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .title {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .pokeball {
        width: 40px;
        height: 40px;
        background: linear-gradient(180deg, #ff0000 50%, #ffffff 50%);
        border-radius: 50%;
        border: 3px solid #000;
        position: relative;
        display: inline-block;
        margin-bottom: 1rem;
      }

      .pokeball::after {
        content: "";
        position: absolute;
        width: 12px;
        height: 12px;
        background: white;
        border: 3px solid #000;
        border-radius: 50%;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body class="flex items-center justify-center p-4">
    <div class="card max-w-md w-full rounded-2xl p-8">
      <div class="text-center">
        <div class="pokeball mx-auto"></div>
        <h1 class="title text-5xl font-bold mb-2">Pokémon Finder</h1>
        <p class="text-gray-600 mb-6">Discover your favorite Pokémon</p>
      </div>

      <div class="space-y-4">
        <div class="relative">
          <input
            id="input"
            type="number"
            placeholder="Enter Pokémon ID (1-1000)"
            class="w-full px-4 py-3 rounded-xl border-2 border-gray-200 transition-all duration-300"
          />
        </div>

        <button
          id="searchButton"
          class="search-btn w-full text-white font-semibold px-6 py-3 rounded-xl shadow-lg"
        >
          Search Pokémon
        </button>
      </div>

      <p
        id="pokemonName"
        class="pokemon-name text-center text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-600 to-pink-600 mt-6 min-h-[2rem]"
      ></p>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
