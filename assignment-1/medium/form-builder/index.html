<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Form Builder</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <section class="w-full grid grid-cols-2 gap-4 p-4">
      <div class="col-span-1">
        <h4 class="text-2xl font-medium">Form Builder</h4>

        <label for="field">Select Field Type</label>
        <select id="field">
          <option value="">-- Select --</option>
          <option value="h2">Heading 2</option>
          <option value="h4">Heading 4</option>
          <option value="p">Paragraph</option>
          <option value="text">Text Input</option>
          <option value="email">Email Input</option>
          <option value="textarea">Textarea</option>
          <option value="checkbox">Checkbox</option>
          <option value="button">Button</option>
        </select>

        <label for="label">Label / Text</label>
        <input type="text" id="label" placeholder="Enter label or text" />

        <button id="addFieldBtn">Add Field</button>
      </div>

      <div class="col-span-1">
        <h4>Form Preview</h4>
        <form class="preview border p-3 space-y-2"></form>
      </div>
    </section>

    <script src="./script.js"></script>
  </body>
</html>
